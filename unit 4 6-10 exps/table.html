<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Impact Visual</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0b0f19;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    max-width: 960px;
    width: 100%;
    aspect-ratio: 16 / 9;
  }
  .card {
    background: radial-gradient(circle at top left, #1e293b, #0f172a);
    border: 1px solid #334155;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  svg {
    width: 100%;
    height: 100%;
    max-height: 180px;
  }
</style>
</head>
<body>

<div class="grid">

  <!-- 1. Social / Safety: Truck + Proximity Shield + Pedestrian -->
  <div class="card">
    <svg viewBox="0 0 200 120">
      <!-- Fog/Dust layers -->
      <path d="M10,95 Q50,85 90,95 T170,95" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
      <path d="M30,105 Q70,98 110,105 T190,105" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
      <!-- Haul Truck Body -->
      <rect x="70" y="45" width="65" height="40" rx="4" fill="#f59e0b"/>
      <path d="M60,40 L90,40 L85,60 L50,60 Z" fill="#d97706"/>
      <circle cx="80" cy="85" r="12" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
      <circle cx="125" cy="85" r="12" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
      <!-- Protective Radar Pulse -->
      <circle cx="102" cy="65" r="35" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.7"/>
      <circle cx="102" cy="65" r="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
      <!-- Worker / Shield Icon -->
      <circle cx="35" cy="55" r="7" fill="#38bdf8"/>
      <path d="M25,78 C25,66 45,66 45,78 Z" fill="#38bdf8"/>
      <polygon points="160,50 172,70 148,70" fill="#ef4444"/>
      <rect x="159" y="58" width="2" height="6" fill="#fff"/>
      <circle cx="160" cy="67" r="1.2" fill="#fff"/>
    </svg>
  </div>

  <!-- 2. Economic: Lower Costs, High Uptime, Growth -->
  <div class="card">
    <svg viewBox="0 0 200 120">
      <!-- Grid Lines -->
      <line x1="20" y1="100" x2="180" y2="100" stroke="#334155" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="20" y2="100" stroke="#334155" stroke-width="1.5"/>
      <!-- Uptrend Path -->
      <polyline points="30,85 70,75 110,50 160,25" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="160" cy="25" r="5" fill="#22c55e"/>
      <!-- Downtrend Cost Reductions -->
      <polyline points="30,35 70,50 110,75 160,90" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
      <!-- Coin Stacks -->
      <ellipse cx="65" cy="85" rx="14" ry="4" fill="#eab308"/>
      <ellipse cx="65" cy="80" rx="14" ry="4" fill="#facc15"/>
      <ellipse cx="105" cy="70" rx="14" ry="4" fill="#eab308"/>
      <ellipse cx="105" cy="65" rx="14" ry="4" fill="#facc15"/>
      <ellipse cx="105" cy="60" rx="14" ry="4" fill="#fef08a"/>
    </svg>
  </div>

  <!-- 3. Environmental: Eco-Shield, Zero Emissions, Fuel Optimization -->
  <div class="card">
    <svg viewBox="0 0 200 120">
      <!-- Clean Earth / Orbit Ring -->
      <ellipse cx="100" cy="60" rx="70" ry="25" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
      <!-- Central Sprout / Leaf Symbol -->
      <path d="M100,75 C80,75 75,55 90,40 C105,25 115,35 115,50 C115,65 105,75 100,75 Z" fill="#10b981" opacity="0.85"/>
      <path d="M100,75 C115,75 125,60 115,48 C105,38 95,45 100,75 Z" fill="#34d399"/>
      <!-- Fuel Gauge / Efficiency Drops -->
      <path d="M45,60 C45,45 60,35 75,35" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="75,30 83,37 75,44" fill="#38bdf8"/>
      <!-- Reduced Exhaust Cutout -->
      <circle cx="150" cy="60" r="14" fill="none" stroke="#ef4444" stroke-width="2"/>
      <line x1="140" y1="50" x2="160" y2="70" stroke="#ef4444" stroke-width="2"/>
      <circle cx="150" cy="60" r="6" fill="#64748b" opacity="0.5"/>
    </svg>
  </div>

  <!-- 4. Technological: 3-Pillar Trilateration Triangle -->
  <div class="card">
    <svg viewBox="0 0 200 120">
      <!-- Trilateration Triangle Waves -->
      <polygon points="100,20 40,95 160,95" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="2"/>
      <!-- 3 Fixed Sensor Nodes -->
      <circle cx="100" cy="20" r="8" fill="#6366f1"/>
      <circle cx="40" cy="95" r="8" fill="#6366f1"/>
      <circle cx="160" cy="95" r="8" fill="#6366f1"/>
      <!-- Pulsing Signal Waves -->
      <circle cx="100" cy="20" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
      <circle cx="40" cy="95" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
      <circle cx="160" cy="95" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
      <!-- Localized Moving Node (Vehicle Coordinate) -->
      <circle cx="95" cy="70" r="6" fill="#f43f5e"/>
      <circle cx="95" cy="70" r="12" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Ray lines to localized point -->
      <line x1="100" y1="20" x2="95" y2="70" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="40" y1="95" x2="95" y2="70" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="160" y1="95" x2="95" y2="70" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
    </svg>
  </div>

</div>

</body>
</html>
